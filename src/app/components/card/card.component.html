<article class="board-card" [class.is-dragging]="dragging()" [draggable]="true" (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd()">
  <div class="card-header">
    <h3 class="card-title">{{ card.title }}</h3>
    <button type="button" class="btn-delete del-btn" [title]="'Delete card ' + card.title"
      [attr.aria-label]="'Delete card ' + card.title" (click)="onDelete($event)">
      X
    </button>
  </div>

  @if (card.desc) {
    <p class="card-desc">{{ card.desc }}</p>
  }

  <div class="card-footer">
    <button type="button" class="btn-share" title="Share card" [attr.aria-label]="'Share card ' + card.title"
      (click)="onShare($event)">
      <span class="share-label">share</span>
      <svg class="share-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </button>
    <time class="card-meta" [attr.datetime]="isoDate">{{ card.fmtDate() }}</time>
  </div>

  @if (copyMsg()) {
    <div class="copy-toast" [class.toast-error]="copyFailed()" role="status">
      {{ copyMsg() }}
    </div>
  }
</article>
